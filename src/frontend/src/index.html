<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vanguard — Enterprise Workflow Engine</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="favicon.ico">

  <!-- Google Fonts: Inter & Material Symbols Outlined -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

  <!-- Early Theme & Language Init (Light par défaut à la connexion) -->
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('vanguard_theme') || 'light';
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        var lang = localStorage.getItem('vanguard_lang') || 'fr';
        document.documentElement.setAttribute('lang', lang === 'en' ? 'en-US' : 'fr-FR');
      } catch (e) {}
    })();
  </script>
</head>
<body class="bg-surface font-body-md text-body-md text-on-surface antialiased">
  <app-root></app-root>
</body>
</html>
